# Used by analysis/correlation_map.py, not by pipeline.py.
#
#     python analysis/correlation_map.py --config configs/analysis/corr_glcm.toml

name = "glcm_only"

[features]
coordinates = false
intensity = false
gradient_intensity = false
glcm = true
