# E2 (cumulative): E0 + spatial, intensity_smoothed, gradient_multiscale, added in the order of the E1 gain.
# Steps 1 (E0 + spatial) and 5 (all groups) are E1_spatial and E3_all, so they are not repeated.
# Settings not listed here keep the values of configs/default.toml.

name = "E2_step3_plus_gradient_multiscale"

[features]
coordinates = true
intensity = true
gradient_intensity = true
intensity_smoothed = true
gradient_multiscale = true
texture = false
spatial = true
glcm = false

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
