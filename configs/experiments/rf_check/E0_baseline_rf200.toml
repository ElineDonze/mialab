# Choice of the number of trees: E0 (7 baseline features) with 200 trees.
# Compared with 50, 100 and 200 trees by cross-validation on the training subjects.
# Settings not listed here keep the values of configs/default.toml.

name = "E0_baseline_rf200"

[features]
coordinates = true
intensity = true
gradient_intensity = true

[random_forest]
n_estimators = 200
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
