# E7: the baseline (7 features) plus 16 learned features of an autoencoder:
# a small 3D autoencoder trained on the 20 training subjects (images only, no labels).
# Needs the stored features: scripts/train_autoencoder.py (see ubelix/train_autoencoder.sbatch).
# Random forest as in E0 (configs/experiments/E0_baseline.toml).

name = "E7_E0_plus_autoencoder"

[features]
coordinates = true
intensity = true
gradient_intensity = true
deep_autoencoder = true

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
