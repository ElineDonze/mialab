# E10: only the 16 learned features, no hand-crafted features:
# a small 3D autoencoder trained on the 20 training subjects (images only, no labels).
# Shows what the learned features know on their own.
# Needs the stored features: scripts/train_autoencoder.py.
# Random forest as in E0 (configs/experiments/E0_baseline.toml).

name = "E10_only_autoencoder"

[features]
coordinates = false
intensity = false
gradient_intensity = false
deep_autoencoder = true

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
