# E5 (max_features): all 79 features, max_features = 2 instead of sqrt (compare with E3_all).
# Settings not listed here keep the values of configs/default.toml.

name = "E5_mf2_all"

[features]
coordinates = true
intensity = true
gradient_intensity = true
intensity_smoothed = true
gradient_multiscale = true
texture = true
spatial = true
glcm = true

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = 2
n_jobs = -1  # all cores; does not change the results
