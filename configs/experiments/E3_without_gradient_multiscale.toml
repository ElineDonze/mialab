# E3 (ablation): all feature groups except "gradient_multiscale".
# Settings not listed here keep the values of configs/default.toml.

name = "E3_without_gradient_multiscale"

[features]
coordinates = true
intensity = true
gradient_intensity = true
intensity_smoothed = true
gradient_multiscale = false
texture = true
spatial = true
glcm = true

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
