# E5 (max_features): as E4_top5, with max_features = 2 instead of sqrt.
# Feature selection inside each fold on the training data only (mialab/utilities/feature_selection.py):
# rank by random forest importance, drop features with |Spearman r| > 0.9 to a better one, keep the best n.
# Settings not listed here keep the values of configs/default.toml.

name = "E5_mf2_top5"

[features]
coordinates = true
intensity = true
gradient_intensity = true
intensity_smoothed = true
gradient_multiscale = true
texture = true
spatial = true
glcm = true

[feature_selection]
n_features = 5
correlation_threshold = 0.9

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = 2
n_jobs = -1  # all cores; does not change the results
