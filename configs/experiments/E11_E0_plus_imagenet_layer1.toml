# E11 (layer comparison): the baseline (7 features) plus 16 features from layer1 only of the ImageNet ResNet-50
# (axial slices, 2 x 256 channels at stride 4, PCA to 16, upsampled). E6_E0_plus_resnet_imagenet uses layer1 + layer2.
# Needs the stored features: scripts/extract_deep_features.py --network resnet_imagenet_layer1.
# Random forest as in E0 (configs/experiments/E0_baseline.toml).

name = "E11_E0_plus_imagenet_layer1"

[features]
coordinates = true
intensity = true
gradient_intensity = true
deep_resnet_imagenet_layer1 = true

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
