# E8: all 79 features + offset_intensity (64 random offset-difference features on T1w/T2w; Zikic et al. 2013).
# Settings not listed here keep the values of configs/default.toml.

name = "E8_all_plus_offset_intensity"

[features]
coordinates = true
intensity = true
gradient_intensity = true
intensity_smoothed = true
gradient_multiscale = true
texture = true
spatial = true
glcm = true
offset_intensity = true

[feature_params.offset_intensity]
n_offsets = 32         # per image (T1w and T2w): 64 features
max_offset_mm = 10.0   # Zikic et al. 2013
sizes_mm = [1.0, 3.0, 5.0]
seed = 0

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
