# E1: the baseline (7 features) plus the feature group "gradient_multiscale".
# Random forest as in E0 (configs/experiments/E0_baseline.toml).

name = "E1_gradient_multiscale"

[features]
coordinates = true
intensity = true
gradient_intensity = true
gradient_multiscale = true

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
