# E9: only the 16 learned features of a supervised U-Net, no hand-crafted features:
# the last decoder layer of a small 3D U-Net (DynUNet), from out-of-fold models (no subject sees its own labels).
# Needs the stored features: scripts/train_unet_features.py (see ubelix/train_unet_features.sbatch).
# Random forest as in E0 (configs/experiments/E0_baseline.toml).

name = "E9_unet_only"

[features]
coordinates = false
intensity = false
gradient_intensity = false
deep_unet = true

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
