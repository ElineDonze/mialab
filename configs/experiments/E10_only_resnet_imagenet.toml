# E10: only the 16 learned features, no hand-crafted features:
# the pretrained network resnet_imagenet (layer1 + layer2, PCA to 16).
# Shows what the learned features know on their own.
# Needs the stored features: scripts/extract_deep_features.py --network resnet_imagenet.
# Random forest as in E0 (configs/experiments/E0_baseline.toml).

name = "E10_only_resnet_imagenet"

[features]
coordinates = false
intensity = false
gradient_intensity = false
deep_resnet_imagenet = true

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
