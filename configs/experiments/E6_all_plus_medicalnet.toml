# E6: all hand-crafted feature groups (79 features, as E3_all) plus 16 deep features of a pretrained network:
# 3D ResNet-50 pretrained by MedicalNet (medical volumes).
# Needs the stored features: scripts/extract_deep_features.py --network medicalnet (GPU, see ubelix/extract_deep_features.sbatch).

name = "E6_all_plus_medicalnet"

[features]
coordinates = true
intensity = true
gradient_intensity = true
intensity_smoothed = true
gradient_multiscale = true
texture = true
spatial = true
glcm = true
deep_medicalnet = true

[random_forest]
n_estimators = 100
max_depth = "none"
max_features = "sqrt"
n_jobs = -1  # all cores; does not change the results
